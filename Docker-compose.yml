version: "3.7"

services:
  app:
    build: .
    ports:
      - 8085:8085
    networks:
      - s-network
    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "0000"
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - 5433:5432
    networks:
      - s-network
    volumes:
      - postgres-data:/var/lib/postgresql/data

networks:
  s-network:
    driver: bridge

volumes:
  postgres-data:
